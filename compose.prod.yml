# Producción AGORA: PHP/Laravel, MariaDB, nginx, frontend. Spring Boot va en compose.spring.yml
# (ver docs/ManualDespliegueAWS.md y .env.prod.example).
services:
  db:
    container_name: agora_db
    build:
      context: ./
      dockerfile: ./docker/mariadb/Dockerfile
    # TODO(srvariable): **Enhancement** instead of keeping these variables
    # in env, use Docker Secrets + Docker Swarm. https://docs.docker.com/engine/swarm/secrets/
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - agora
    ports:
      # Necesario si Spring Boot corre en otra VM (misma VPC / SG). Quitar o restringir si todo va en un solo host.
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/3306' || exit 1"]
      timeout: 10s
      retries: 15
      interval: 5s

  db_generator:
    container_name: agora_generator
    build:
      context: ./
      dockerfile: ./docker/python/Dockerfile
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agora
    # After the build is done, we don't need the container anymore
    restart: no

  backend:
    container_name: agora_backend
    build:
      context: ./
      dockerfile: ./docker/php/Dockerfile
    environment:
      # https://stackoverflow.com/a/64418443
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      SANCTUM_STATEFUL_DOMAINS: ${SESSION_DOMAIN},${SESSION_DOMAIN_AUTH}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      BESU_RPC_URL: ${BESU_RPC_URL}
      BLOCKCHAIN_ADMIN_ADDRESS: ${BLOCKCHAIN_ADMIN_ADDRESS}
      SIMPLE_VOTING_ADDRESS: ${SIMPLE_VOTING_ADDRESS}
      WEB3_PROVIDER_URL: ${WEB3_PROVIDER_URL}
      BLOCKCHAIN_EXPECTED_CLIENT: ${BLOCKCHAIN_EXPECTED_CLIENT:-}
    volumes:
      - backend_data:/var/www/html
    networks:
      - agora
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    container_name: agora_scheduler
    build:
      context: ./
      dockerfile: ./docker/php/Dockerfile
    environment:
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      SANCTUM_STATEFUL_DOMAINS: ${SESSION_DOMAIN},${SESSION_DOMAIN_AUTH}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      BESU_RPC_URL: ${BESU_RPC_URL}
      BLOCKCHAIN_ADMIN_ADDRESS: ${BLOCKCHAIN_ADMIN_ADDRESS}
      SIMPLE_VOTING_ADDRESS: ${SIMPLE_VOTING_ADDRESS}
      WEB3_PROVIDER_URL: ${WEB3_PROVIDER_URL}
    volumes:
      - backend_data:/var/www/html
    networks:
      - agora
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]

  frontend:
    container_name: agora_frontend
    build:
      context: ./
      dockerfile: ./docker/node/Dockerfile
      args:
        VITE_AUTH_URL: ${VITE_AUTH_URL:-}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SPRING_HTTP_URL: ${VITE_SPRING_HTTP_URL:-}
        VITE_SPRING_WS_URL: ${VITE_SPRING_WS_URL:-}
        VITE_VOTATIONS_ADMIN_TOKEN: ${VITE_VOTATIONS_ADMIN_TOKEN:-}
    networks:
      - agora
    volumes:
      - frontend_data:/agora/dist
    # After the build is done, we don't need the container anymore
    restart: no

  server:
    container_name: agora_server
    build:
      context: ./
      dockerfile: ./docker/nginx/Dockerfile
    environment:
      SPRING_PRIVATE_IP: ${SPRING_PRIVATE_IP:-127.0.0.1}
    # Compatibilidad: compose antiguos no aceptan depends_on.condition. Para forzar dist fresco tras cambios:
    #   docker compose -f compose.prod.yml --env-file .env run --rm frontend
    #   docker compose -f compose.prod.yml --env-file .env up -d server
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - frontend_data:/var/www/frontend
      - backend_data:/var/www/html
      - ./docker/nginx/certs:/etc/nginx/certs
      # - ./docker/nginx/default.conf:/etc/nginx/default.conf
      - certbot_data:/var/www/certbot
      - letsencrypt_data:/etc/letsencrypt
    networks:
      - agora
    restart: unless-stopped

  certbot:
    container_name: agora_certbot
    build:
      context: ./docker/certbot
    volumes:
      - certbot_data:/var/www/certbot
      - letsencrypt_data:/etc/letsencrypt
    depends_on:
      - server
    networks:
      - agora
    restart: unless-stopped

volumes:
  db_data:
  frontend_data:
  backend_data:
  certbot_data:
  letsencrypt_data:

networks:
  agora:
    driver: bridge