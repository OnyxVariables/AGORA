# Producción AGORA unificada: PHP/Laravel, MariaDB, Spring Boot, nginx y frontend
# en un único docker-compose (ver también .env.prod.example).
services:
  db:
    container_name: agora_db
    build:
      context: ./
      dockerfile: ./docker/mariadb/Dockerfile
    # TODO(srvariable): **Enhancement** instead of keeping these variables
    # in env, use Docker Secrets + Docker Swarm. https://docs.docker.com/engine/swarm/secrets/
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - agora
    ports:
      # Necesario si Spring Boot corre en otra VM (misma VPC / SG). Quitar o restringir si todo va en un solo host.
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/3306' || exit 1"]
      timeout: 10s
      retries: 15
      interval: 5s

  db_generator:
    container_name: agora_generator
    build:
      context: ./
      dockerfile: ./docker/python/Dockerfile
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agora
    # After the build is done, we don't need the container anymore
    restart: no

  backend:
    container_name: agora_backend
    build:
      context: ./
      dockerfile: ./docker/php/Dockerfile
    env_file:
      - ./.env
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      # https://stackoverflow.com/a/64418443
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE}
      # Hosts reales (sin punto inicial). No uses SESSION_DOMAIN aquí: Sanctum compara el header Host.
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-agorachain.es,www.agorachain.es,auth.agorachain.es}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      BESU_RPC_URL: ${BESU_RPC_URL}
      BESU_PRIVATE_KEY: ${BESU_PRIVATE_KEY}
      CHAIN_ID: ${CHAIN_ID:-1337}
      BLOCKCHAIN_ADMIN_ADDRESS: ${BLOCKCHAIN_ADMIN_ADDRESS}
      SIMPLE_VOTING_ADDRESS: ${SIMPLE_VOTING_ADDRESS}
      AGORA_FORCE_ABI_SYNC: ${AGORA_FORCE_ABI_SYNC:-false}
      WEB3_PROVIDER_URL: ${WEB3_PROVIDER_URL}
      BLOCKCHAIN_EXPECTED_CLIENT: ${BLOCKCHAIN_EXPECTED_CLIENT:-}
      # CORS: login-cert en auth.* desde SPA en www o apex (lista separada por comas).
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
      VOTATION_DURATION_MINUTES: ${VOTATION_DURATION_MINUTES:-720}
      AGORA_DEMO_AUTH: ${AGORA_DEMO_AUTH:-false}
      AGORA_INSECURE_MODE: ${AGORA_INSECURE_MODE:-false}
      AGORA_INSECURE_ADMIN_USER_ID: ${AGORA_INSECURE_ADMIN_USER_ID:-}
      AGORA_INSECURE_CITIZEN_USER_ID: ${AGORA_INSECURE_CITIZEN_USER_ID:-}
    volumes:
      - backend_data:/var/www/html
    networks:
      - agora
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    container_name: agora_scheduler
    build:
      context: ./
      dockerfile: ./docker/php/Dockerfile
    env_file:
      - ./.env
    environment:
      # Mismas migraciones que backend (mismo volumen); evita carrera al crear tabla migrations.
      AGORA_SKIP_MIGRATE: "true"
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE}
      # Hosts reales (sin punto inicial). No uses SESSION_DOMAIN aquí: Sanctum compara el header Host.
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-agorachain.es,www.agorachain.es,auth.agorachain.es}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      BESU_RPC_URL: ${BESU_RPC_URL}
      BESU_PRIVATE_KEY: ${BESU_PRIVATE_KEY}
      CHAIN_ID: ${CHAIN_ID:-1337}
      BLOCKCHAIN_ADMIN_ADDRESS: ${BLOCKCHAIN_ADMIN_ADDRESS}
      SIMPLE_VOTING_ADDRESS: ${SIMPLE_VOTING_ADDRESS}
      AGORA_FORCE_ABI_SYNC: ${AGORA_FORCE_ABI_SYNC:-false}
      WEB3_PROVIDER_URL: ${WEB3_PROVIDER_URL}
      BLOCKCHAIN_EXPECTED_CLIENT: ${BLOCKCHAIN_EXPECTED_CLIENT:-}
      VOTATION_DURATION_MINUTES: ${VOTATION_DURATION_MINUTES:-720}
      AGORA_DEMO_AUTH: ${AGORA_DEMO_AUTH:-false}
      AGORA_INSECURE_MODE: ${AGORA_INSECURE_MODE:-false}
      AGORA_INSECURE_ADMIN_USER_ID: ${AGORA_INSECURE_ADMIN_USER_ID:-}
      AGORA_INSECURE_CITIZEN_USER_ID: ${AGORA_INSECURE_CITIZEN_USER_ID:-}
    volumes:
      - backend_data:/var/www/html
    networks:
      - agora
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]

  springboot:
    container_name: agora_springboot
    build:
      context: ./
      dockerfile: ./docker/springboot/Dockerfile
    env_file:
      - ./.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:${DB_CONNECTION}://db:${DB_PORT}/${DB_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      WEB3J_CLIENT_URL: ${BESU_RPC_URL}
      WEB3J_CONTRACT_ADDRESS: ${SIMPLE_VOTING_ADDRESS}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}
      SERVER_PORT: ${SPRING_PORT}
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      VOTATIONS_ADMIN_TOKEN: ${VOTATIONS_ADMIN_TOKEN:-}
      KUBERNETES_ENABLED: ${KUBERNETES_ENABLED:-false}
      KUBERNETES_NAMESPACE: ${KUBERNETES_NAMESPACE:-besu}
      WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:-http://agorachain.es,http://www.agorachain.es}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agora
    restart: unless-stopped
    volumes:
      - ./kube/config:/root/.kube/config:ro

  frontend:
    container_name: agora_frontend
    build:
      context: ./
      dockerfile: ./docker/node/Dockerfile
      args:
        VITE_AUTH_URL: ${VITE_AUTH_URL:-}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_DISABLE_AUTH: ${VITE_DISABLE_AUTH:-}
        VITE_SPRING_HTTP_URL: ${VITE_SPRING_HTTP_URL:-}
        VITE_SPRING_WS_URL: ${VITE_SPRING_WS_URL:-}
        VITE_VOTATIONS_ADMIN_TOKEN: ${VITE_VOTATIONS_ADMIN_TOKEN:-}
    networks:
      - agora
    volumes:
      - frontend_data:/agora/dist
    # After the build is done, we don't need the container anymore
    restart: no

  server:
    container_name: agora_server
    build:
      context: ./
      dockerfile: ./docker/nginx/Dockerfile
    environment:
      SPRING_PRIVATE_IP: ${SPRING_PRIVATE_IP:-springboot}
    # Compatibilidad: compose antiguos no aceptan depends_on.condition. Para forzar dist fresco tras cambios:
    #   docker compose -f compose.prod.yml --env-file .env run --rm frontend
    #   docker compose -f compose.prod.yml --env-file .env up -d server
    depends_on:
      - backend
      - springboot
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - frontend_data:/var/www/frontend
      - backend_data:/var/www/html
      - ./docker/nginx/certs:/etc/nginx/certs
      # - ./docker/nginx/default.conf:/etc/nginx/default.conf
      - certbot_data:/var/www/certbot
      - letsencrypt_data:/etc/letsencrypt
    networks:
      - agora
    restart: unless-stopped

  certbot:
    container_name: agora_certbot
    build:
      context: ./docker/certbot
    volumes:
      - certbot_data:/var/www/certbot
      - letsencrypt_data:/etc/letsencrypt
    depends_on:
      - server
    networks:
      - agora
    restart: unless-stopped

volumes:
  db_data:
  frontend_data:
  backend_data:
  certbot_data:
  letsencrypt_data:

networks:
  agora:
    driver: bridge