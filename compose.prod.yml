services:
  db:
    container_name: agora_db
    build:
      context: ./
      dockerfile: ./docker/mariadb/Dockerfile
    # TODO(srvariable): **Enhancement** instead of keeping these variables
    # in env, use Docker Secrets + Docker Swarm. https://docs.docker.com/engine/swarm/secrets/
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - agora
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/3306' || exit 1"]
      timeout: 10s
      retries: 15
      interval: 5s

  db_generator:
    container_name: agora_generator
    build:
      context: ./
      dockerfile: ./docker/python/Dockerfile
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agora
    # After the build is done, we don't need the container anymore
    restart: no

  backend:
    container_name: agora_backend
    build:
      context: ./
      dockerfile: ./docker/php/Dockerfile
    environment:
      # https://stackoverflow.com/a/64418443
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      SANCTUM_STATEFUL_DOMAINS: ${SESSION_DOMAIN},${SESSION_DOMAIN_AUTH}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - backend_data:/var/www/html
    networks:
      - agora
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    container_name: agora_scheduler
    build:
      context: ./
      dockerfile: ./docker/php/Dockerfile
    environment:
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      SANCTUM_STATEFUL_DOMAINS: ${SESSION_DOMAIN},${SESSION_DOMAIN_AUTH}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - backend_data:/var/www/html
    networks:
      - agora
    depends_on:
      db:
        condition: service_healthy
      hardhat:
        condition: service_healthy
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]

  frontend:
    container_name: agora_frontend
    build:
      context: ./
      dockerfile: ./docker/node/Dockerfile
    networks:
      - agora
    volumes:
      - frontend_data:/agora/dist
    # After the build is done, we don't need the container anymore
    restart: no

  server:
    container_name: agora_server
    build:
      context: ./
      dockerfile: ./docker/nginx/Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - frontend_data:/var/www/frontend
      - backend_data:/var/www/html
      - ./docker/nginx/certs:/etc/nginx/certs
      # - ./docker/nginx/default.conf:/etc/nginx/default.conf
      - certbot_data:/var/www/certbot
      - letsencrypt_data:/etc/letsencrypt
    networks:
      - agora
    restart: unless-stopped

  certbot:
    container_name: agora_certbot
    build:
      context: ./docker/certbot
    volumes:
      - certbot_data:/var/www/certbot
      - letsencrypt_data:/etc/letsencrypt
    restart: unless-stopped

  springboot:
    container_name: agora_springboot
    build:
      context: ./
      dockerfile: ./docker/springboot/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:${DB_CONNECTION}://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      WEB3J_CLIENT_URL: ${BESU_RPC_URL:-http://hardhat:8545}
      WEB3J_CONTRACT_ADDRESS: ${SIMPLE_VOTING_ADDRESS:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}
      SERVER_PORT: ${SPRING_PORT}
      SPRING_MAIN_LAZY_INITIALIZATION: true
    depends_on:
      db:
        condition: service_healthy
      hardhat:
        condition: service_healthy
    networks:
      - agora
    restart: unless-stopped

volumes:
  db_data:
  frontend_data:
  backend_data:
  certbot_data:
  letsencrypt_data:

networks:
  agora:
    driver: bridge