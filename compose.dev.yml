# Development environment - based on compose.yml
services:
  db:
    container_name: agora_db_dev
    build:
      context: ./
      dockerfile: ./docker/mariadb/Dockerfile
    environment:
      MYSQL_DATABASE: ${DB_NAME:-agora_dev}
      MYSQL_USER: ${DB_USER_NAME:-agorauser}
      MYSQL_PASSWORD: ${DB_USER_PASS:-agorapass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root}
    networks:
      - agora_dev
    volumes:
      - db_data_dev:/var/lib/mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      timeout: 20s
      retries: 10
      interval: 10s

  db_generator:
    container_name: agora_generator_dev
    build:
      context: ./
      dockerfile: ./docker/python/Dockerfile
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-agora_dev}
      DB_USERNAME: ${DB_USER_NAME:-agorauser}
      DB_PASSWORD: ${DB_USER_PASS:-agorapass}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agora_dev
    restart: no

  hardhat:
    container_name: agora_hardhat_dev
    build:
      context: ./blockchain
      dockerfile: ../docker/hardhat/Dockerfile
    environment:
      NODE_ENV: development
    networks:
      - agora_dev
    volumes:
      - ./blockchain:/app
      - hardhat_data_dev:/app/data
      - backend_data_dev:/var/www/html  # Para actualizar .env
    restart: unless-stopped
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /var/www/html/storage/app/SimpleVoting.json"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    container_name: agora_backend_dev
    build:
      context: ./
      dockerfile: ./docker/php/Dockerfile
    environment:
      # Development environment settings
      SESSION_DOMAIN: localhost
      SANCTUM_STATEFUL_DOMAINS: localhost:5173
      APP_ENV: local
      APP_DEBUG: true
      APP_URL: http://localhost:8000
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_CONNECTION: ${DB_CONNECTION:-mariadb}
      DB_DATABASE: ${DB_DATABASE:-agora_dev}
      DB_USERNAME: ${DB_USER_NAME:-agorauser}
      DB_PASSWORD: ${DB_USER_PASS:-agorapass}
      # Variables de Blockchain
      BESU_RPC_URL: http://hardhat:8545
      BLOCKCHAIN_ADMIN_ADDRESS: 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
      SIMPLE_VOTING_ADDRESS: ${SIMPLE_VOTING_ADDRESS:-}
    volumes:
      - backend_data_dev:/var/www/html
      - ./.env.dev:/var/www/html/.env  # Development environment file
    networks:
      - agora_dev
    depends_on:
      db:
        condition: service_healthy
      hardhat:
        condition: service_healthy  # Esperar a que contrato esté desplegado
    restart: unless-stopped
    ports:
      - "8000:8000"

  frontend:
    container_name: agora_frontend_dev
    build:
      context: ./
      dockerfile: ./docker/node/Dockerfile
    environment:
      VITE_API_URL: http://server:80
      VITE_APP_URL: http://localhost:5173
    networks:
      - agora_dev
    volumes:
      - frontend_data_dev:/agora/dist
      - ./frontend:/agora  # Live reload for development
      - /agora/node_modules  # Preserve node_modules from build
    restart: unless-stopped
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--force"]

  server:
    container_name: agora_server_dev
    build:
      context: ./
      dockerfile: ./docker/nginx/Dockerfile
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - frontend_data_dev:/var/www/frontend
      - backend_data_dev:/var/www/html
      - ./docker/nginx/default-dev.conf:/etc/nginx/conf.d/default.conf  # Configuración desarrollo sin SSL
    networks:
      - agora_dev
    restart: unless-stopped

  springboot:
    container_name: agora_springboot_dev
    build:
      context: ./
      dockerfile: ./docker/springboot/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:${DB_CONNECTION}://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: "true"
      WEB3J_CLIENT_URL: http://hardhat:8545
      WEB3J_CONTRACT_ADDRESS: ${SIMPLE_VOTING_ADDRESS}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}
      SERVER_PORT: ${SPRING_PORT}
      SPRING_MAIN_LAZY_INITIALIZATION: true
    depends_on:
      db:
        condition: service_healthy
      hardhat:
        condition: service_healthy
    networks:
      - agora_dev
    restart: unless-stopped
    ports:
      - "8080:8080"

  # certbot not needed in development
  # certbot:
  #   container_name: agora_certbot_dev
  #   ...

volumes:
  db_data_dev:
  frontend_data_dev:
  backend_data_dev:
  hardhat_data_dev:

networks:
  agora_dev:
    driver: bridge
