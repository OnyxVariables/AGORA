name: Deploy showcase to GitHub Pages

# Publishes ONLY the /showcase folder. The rest of the repository
# (backend, votations, blockchain, docker, docs...) is never uploaded.
on:
  push:
    branches: [main]
    paths:
      - "showcase/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload showcase as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase

      - id: deployment
        uses: actions/deploy-pages@v4