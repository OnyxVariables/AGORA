upstream spring_votations {
    server @@SPRING_PRIVATE_IP@@:8081;
    keepalive 8;
}

server {
    listen 80;
    server_name agorachain.es www.agorachain.es;

    # Necesario para subir logos de partido (multipart) sin romper en 413.
    client_max_body_size 8M;

    location /.well-known/acme-challenge {
        root /var/www/certbot;
    }

    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /ws {
        proxy_pass http://spring_votations;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location ^~ /api/admin/cluster {
        proxy_pass http://spring_votations;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /actuator/ {
        proxy_pass http://spring_votations;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/ {
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;

        fastcgi_param SSL_CLIENT_VERIFY   $ssl_client_verify;
        fastcgi_param SSL_CLIENT_S_DN     $ssl_client_s_dn;
        fastcgi_param SSL_CLIENT_SERIAL   $ssl_client_serial;
        fastcgi_param SSL_CLIENT_CERT     $ssl_client_escaped_cert;
    }
}