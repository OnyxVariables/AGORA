server {
	listen 80;
	server_name localhost;

	location / {
		root /var/www/html/public;
		index index.php;
		try_files $uri $uri/ /index.html;
	}

	location /api/ {
		alias /var/www/html/public/;
		index index.php;
		try_files $uri $uri/ @laravel;

		location ~ \.php$ {
			fastcgi_pass backend:9000;
			fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
			include fastcgi_params;
			
			# En desarrollo, simular variables SSL para que funcione igual que producción
			fastcgi_param SSL_CLIENT_VERIFY   "SUCCESS";
			fastcgi_param SSL_CLIENT_S_DN     "serialNumber=IDCES-38660052L";
			fastcgi_param SSL_CLIENT_SERIAL   "38660052L";
			fastcgi_param SSL_CLIENT_CERT     "";
		}
	}

	location @laravel {
		fastcgi_pass backend:9000;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
		fastcgi_param REQUEST_URI $request_uri;
		
		# También pasar variables SSL en @laravel
		fastcgi_param SSL_CLIENT_VERIFY   "SUCCESS";
		fastcgi_param SSL_CLIENT_S_DN     "serialNumber=IDCES-38660052L";
		fastcgi_param SSL_CLIENT_SERIAL   "38660052L";
		fastcgi_param SSL_CLIENT_CERT     "";
	}

	error_log /var/log/nginx/error.log;
	access_log /var/log/nginx/access.log;
}
