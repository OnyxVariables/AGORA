# Redirigir HTTP a HTTPS
<VirtualHost *:80>
    ServerName agora.com
    Redirect permanent / https://agora.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName agora.com

    # Configuración SSL básica del servidor
    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/server.crt
    SSLCertificateKeyFile /etc/apache2/certs/server.key
    
    # Certificados de las CAs que emiten certificados a usuarios (FNMT, etc.)
    # Esto NO son certificados de usuarios, son de las autoridades certificadoras
    SSLCACertificateFile /etc/apache2/certs/ca.crt
    
    # NO verificar cliente por defecto (la app funciona normal)
    SSLVerifyClient none
    SSLVerifyDepth 10

    # Documentos del backend Laravel
    DocumentRoot /var/www/html/public

    # Configurar PHP-FPM
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php:9000"
    </FilesMatch>

    # Directorio principal - Acceso normal sin certificado
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # RUTA PROTEGIDA: Solo /api/login-cert requiere certificado
    <LocationMatch "^/api/login-cert">
        # Aquí SÍ se fuerza el certificado digital
        SSLVerifyClient require
        SSLVerifyDepth 10
        SSLOptions +StdEnvVars +ExportCertData
        
        # Pasar información del certificado a Laravel mediante headers
        RequestHeader set X-SSL-Client-Cert "%{SSL_CLIENT_CERT}s"
        RequestHeader set X-SSL-Client-S-DN "%{SSL_CLIENT_S_DN}s"
        RequestHeader set X-SSL-Client-I-DN "%{SSL_CLIENT_I_DN}s"
        RequestHeader set X-SSL-Client-Serial "%{SSL_CLIENT_M_SERIAL}s"
        RequestHeader set X-SSL-Verified "%{SSL_CLIENT_VERIFY}s"
    </LocationMatch>

    # Servir frontend estático
    Alias /frontend /var/www/frontend
    <Directory /var/www/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        
        # Para SPAs - redirigir todo a index.html
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /frontend/
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /frontend/index.html [L]
        </IfModule>
    </Directory>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    # Log SSL para debugging
    CustomLog ${APACHE_LOG_DIR}/ssl_request.log \
        "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"
</VirtualHost>