      --p2p-port=30305 
      --rpc-http-enabled 
      --rpc-http-api=ETH,NET,QBFT,WEB3 
      --host-allowlist="*" 
      --rpc-http-cors-origins="all" 
      --rpc-http-port=8547 
      --nat-method=DOCKER 
      --profile=ENTERPRISE 
    networks: 
    - besu-network

  node4: 
    image: hyperledger/besu:latest 
