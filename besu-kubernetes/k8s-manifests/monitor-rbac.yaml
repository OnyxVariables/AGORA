# ServiceAccount + Role para que el pod de Spring Boot (monitor de cluster)
# pueda listar pods Besu en el namespace besu
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agora-votations-monitor
  namespace: besu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agora-besu-pods-reader
  namespace: besu
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agora-votations-monitor-besu-pods
  namespace: besu
subjects:
  - kind: ServiceAccount
    name: agora-votations-monitor
    namespace: besu
roleRef:
  kind: Role
  name: agora-besu-pods-reader
  apiGroup: rbac.authorization.k8s.io
