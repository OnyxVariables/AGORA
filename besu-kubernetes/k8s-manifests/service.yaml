apiVersion: v1
kind: Service
metadata:
  name: besu-service
  namespace: besu
  labels:
    app: besu-node
spec:
  clusterIP: None  # Crea un servicio "Headless" para que cada nodo tenga su DNS
  selector:
    app: besu-node
  ports:
    - name: p2p
      port: 30303
    - name: rpc
      port: 8545
    - name: metrics
      port: 9545
      targetPort: 9545
---
apiVersion: v1
kind: Service
metadata:
  name: besu-rpc-public
  namespace: besu
spec:
  type: NodePort
  selector:
    app: besu-node
  ports:
    - protocol: TCP
      port: 8545
      targetPort: 8545
      nodePort: 30001 # Puerto externo fijo para el RPC