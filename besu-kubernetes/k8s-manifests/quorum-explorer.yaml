apiVersion: apps/v1
kind: Deployment
metadata:
  name: quorum-explorer
  namespace: besu
  labels:
    app: quorum-explorer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quorum-explorer
  template:
    metadata:
      labels:
        app: quorum-explorer
    spec:
      containers:
      - name: explorer
        image: consensys/quorum-explorer:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: NODE_ENDPOINT
          value: "http://besu-rpc-public.besu.svc.cluster.local:8545"
        - name: NETWORK_ID
          value: "1337"
        - name: PORT
          value: "80"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: quorum-explorer
  namespace: besu
  labels:
    app: quorum-explorer
spec:
  type: NodePort
  selector:
    app: quorum-explorer
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30010
    protocol: TCP
