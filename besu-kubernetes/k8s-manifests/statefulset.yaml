apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: besu
spec:
  serviceName: "besu-service"
  replicas: 4
  selector:
    matchLabels:
      app: besu-node
  template:
    metadata:
      labels:
        app: besu-node
    spec:
      containers:
      - name: besu-node
        image: hyperledger/besu:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            POD_ID=${HOSTNAME##*-}
            
            # Lanzamos Besu apuntando directamente al archivo del Secret
            besu --data-path=/opt/besu/data \
            --genesis-file=/etc/besu/genesis.json \
            --node-private-key-file=/opt/besu/keys/key-$POD_ID \
            --static-nodes-file=/etc/besu/static-nodes.json \
            --rpc-http-enabled=true \
            --rpc-http-api=ETH,NET,QBFT,WEB3 \
            --rpc-http-host=0.0.0.0 \
            --rpc-http-cors-origins="*" \
            --p2p-enabled=true \
            --p2p-host=$(hostname).besu-service \
            --host-allowlist="*" \
            --profile=ENTERPRISE
        ports:
        - containerPort: 30303
          name: p2p
        - containerPort: 8545
          name: rpc
        volumeMounts:
        - name: genesis-vol
          mountPath: /etc/besu
        - name: data-vol
          mountPath: /opt/besu/data
        - name: node-key-vol # The name is the same than the other volumes of the bottom
          mountPath: /opt/besu/keys
      volumes:
      - name: genesis-vol
        configMap:
          name: besu-genesis-config
      - name: node-key-vol
        secret:
          secretName: besu-node-keys
  volumeClaimTemplates:
  - metadata:
      name: data-vol
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi