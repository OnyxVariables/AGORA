spring.application.name=votations-test
spring.datasource.url=jdbc:h2:mem:agoratest;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

blockchain.contract.address=0x0000000000000000000000000000000000000001
web3j.client-url=http://127.0.0.1:8545

logging.level.com.agora.votations=INFO

agora.blockchain-listener.enabled=false
