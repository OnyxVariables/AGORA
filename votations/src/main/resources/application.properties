spring.application.name=votations

# MariaDB Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/agora}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agorauser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:agorapass}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Blockchain Configuration
blockchain.contract.address=${WEB3J_CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}
web3j.client-url=${WEB3J_CLIENT_URL:http://localhost:8545}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# Orígenes permitidos para STOMP/SockJS (coma-separado). Sobrescribible por env WEBSOCKET_ALLOWED_ORIGIN_PATTERNS
app.websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*,https://agorachain.es,https://www.agorachain.es}

# WebSocket vote coalescing (VoteAggregator)
app.ws.flush-interval-ms=250
app.ws.flush-batch-size=500

# Admin token for /actuator/* and /api/admin/* (optional; vacío = sin filtro)
app.admin.token=${VOTATIONS_ADMIN_TOKEN:}

# Kubernetes (Besu pods); desactivado por defecto en local
app.kubernetes.enabled=${KUBERNETES_ENABLED:false}
app.kubernetes.namespace=${KUBERNETES_NAMESPACE:default}
app.kubernetes.pod-label-key=app
app.kubernetes.pod-label-value=besu-node
app.kubernetes.broadcast-interval-ms=5000